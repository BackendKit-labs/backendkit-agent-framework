apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: orchestrator-coder-v2
  labels:
    app: orchestrator-coder-v2
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - orchestrator.backendkit.dev
      secretName: orchestrator-tls
  rules:
    - host: orchestrator.backendkit.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: orchestrator-coder-v2
                port:
                  number: 3000
