# ============================================================
# Finance Agent — Kubernetes Secrets (placeholders)
# ============================================================
# IMPORTANTE: Este archivo contiene placeholders. Antes de aplicar
# a un clúster, reemplace los valores con los secretos reales
# codificados en base64.
#
# Para generar los valores reales:
#   echo -n "tu-api-key-real" | base64
#
# O mejor aún, use SealedSecrets, External Secrets Operator
# o Vault para gestionar secretos de forma segura.
#
# Ejemplo con kubectl create secret (evita exponer en git):
#   kubectl create secret generic finance-agent-secrets \
#     --namespace finance \
#     --from-literal=DEEPSEEK_API_KEY='tu-valor-real' \
#     --from-literal=SCHEDULER_API_KEY='tu-valor-real' \
#     --from-literal=NOTIFIER_API_KEY='tu-valor-real' \
#     --dry-run=client -o yaml > k8s/secret.yaml
# ============================================================
apiVersion: v1
kind: Secret
metadata:
  name: finance-agent-secrets
  namespace: finance
  labels:
    app: finance-agent
    managed-by: placeholder
type: Opaque
data:
  # Atención: Estos son placeholders. Reemplazar con valores
  # reales codificados en base64 antes de aplicar al clúster.
  # NO committear secretos reales en el repositorio.
  DEEPSEEK_API_KEY: "{{ BASE64_DEEPSEEK_API_KEY }}"
  SCHEDULER_API_KEY: "{{ BASE64_SCHEDULER_API_KEY }}"
  NOTIFIER_API_KEY: "{{ BASE64_NOTIFIER_API_KEY }}"
