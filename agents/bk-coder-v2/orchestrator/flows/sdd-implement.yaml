# SDD Implementation Flow
# Executes the full Spec-Driven Development implementation cycle.
# Auto-matched when the task mentions "sdd", "spec-driven", or "implementar feature".
# Can also be forced with flow_id="sdd-implement".

version: 1
id: sdd-implement
name: "SDD Implementation"
description: >
  Implements a feature following the Spec-Driven Development process:
  1. Design Review (human gate)
  2. Backend Implementation (phase by phase)
  3. QA Validation (automated gate)
  4. Security Review (automated if applicable)
  5. Infrastructure Generation

steps:
  # ── Step 1: Design Review ──────────────────────────────────────────────
  - id: design-review
    agent: qa-mcp
    task: >
      Review the design documents (specification.md, design.md, ROADMAP.md)
      in the project root. Verify that:
      - All requirements are clearly defined
      - ADRs are documented
      - The roadmap has clear phases with completion criteria
      - The design is implementable

      Provide a summary of findings.
    gate: true
    gate_criteria:
      - "Specification covers all functional requirements"
      - "ADRs are documented with context and consequences"
      - "Roadmap phases have verifiable completion criteria"
      - "Design is consistent and implementable"

  # ── Step 2: Backend Implementation (Phase 1) ───────────────────────────
  - id: backend-phase-1
    agent: backend-mcp
    task: >
      Implement Phase 1 of the ROADMAP.
      Read specification.md and ROADMAP.md from the project root.
      Create the necessary files in src/.
      Follow the completion criteria defined in the roadmap.
    depends_on: [design-review]

  # ── Step 3: QA Validation (Phase 1) ────────────────────────────────────
  - id: qa-phase-1
    agent: qa-mcp
    task: >
      Validate Phase 1 implementation against specification.md.
      Read the spec and the implemented code.
      Check each criterion and ADR compliance.
      Generate qa-phase1.md report in .qa/ directory.
    depends_on: [backend-phase-1]
    gate: true
    gate_criteria:
      - "All phase 1 criteria from specification are met"
      - "ADRs are respected in the implementation"
      - "Code follows best practices"
      - "No critical issues found"

  # ── Step 4: Backend Implementation (Phase 2) ───────────────────────────
  - id: backend-phase-2
    agent: backend-mcp
    task: >
      Implement Phase 2 of the ROADMAP.
      Read specification.md and ROADMAP.md.
      Consider the context from Phase 1 implementation.
      Create the necessary files in src/.
    depends_on: [qa-phase-1]

  # ── Step 5: QA Validation (Phase 2) ────────────────────────────────────
  - id: qa-phase-2
    agent: qa-mcp
    task: >
      Validate Phase 2 implementation against specification.md.
      Generate qa-phase2.md report in .qa/ directory.
    depends_on: [backend-phase-2]
    gate: true
    gate_criteria:
      - "All phase 2 criteria from specification are met"
      - "ADRs are respected"
      - "Integration with Phase 1 is correct"

  # ── Step 6: Backend Implementation (Phase 3) ───────────────────────────
  - id: backend-phase-3
    agent: backend-mcp
    task: >
      Implement Phase 3 of the ROADMAP.
      Read specification.md and ROADMAP.md.
      Consider context from previous phases.
      Create the necessary files in src/.
    depends_on: [qa-phase-2]

  # ── Step 7: QA Validation (Phase 3) ────────────────────────────────────
  - id: qa-phase-3
    agent: qa-mcp
    task: >
      Validate Phase 3 implementation against specification.md.
      Generate qa-phase3.md report in .qa/ directory.
    depends_on: [backend-phase-3]
    gate: true
    gate_criteria:
      - "All phase 3 criteria from specification are met"
      - "ADRs are respected"
      - "Full implementation is consistent"

  # ── Step 8: Security Review ────────────────────────────────────────────
  - id: security-review
    agent: security-mcp
    task: >
      Review all implemented code for security vulnerabilities.
      Scan src/ directory for OWASP Top 10 issues.
      Generate security-review.md report in .security/ directory.
    depends_on: [qa-phase-3]
    gate: true
    gate_criteria:
      - "No critical or high vulnerabilities"
      - "Secrets are properly managed"
      - "Authentication and authorization are correct"
      - "Input validation is present"

  # ── Step 9: Infrastructure Generation ──────────────────────────────────
  - id: infra-generation
    agent: infra-mcp
    task: >
      Generate infrastructure configuration for the project.
      Detect the project stack and create:
      - Dockerfile (multi-stage, production-ready)
      - docker-compose.yml (with necessary services)
      - CI/CD pipeline (.github/workflows/ci.yml)
      - Kubernetes manifests (k8s/deployment.yaml, service.yaml, configmap.yaml)
    depends_on: [security-review]

  # ── Step 10: Final QA ──────────────────────────────────────────────────
  - id: final-qa
    agent: qa-mcp
    task: >
      Perform a final validation of the complete implementation.
      Review all phases, security findings, and infrastructure config.
      Generate a final summary report.
    depends_on: [infra-generation]
    gate: true
    gate_criteria:
      - "All phases implemented and validated"
      - "Security review passed"
      - "Infrastructure configuration generated"
      - "Full implementation is consistent and complete"
