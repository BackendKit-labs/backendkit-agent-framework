version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: agent-cloud-backend
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - JWT_SECRET=${JWT_SECRET:-super-secret-jwt-key-change-in-production}
      - JWT_EXPIRATION=${JWT_EXPIRATION:-1h}
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:postgres@db:5432/agent_cloud}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      # Runtime (Fase 1: RuntimeSPI) — el backend habla con el daemon Docker del host.
      - DOCKER_HOST=${DOCKER_HOST:-unix:///var/run/docker.sock}
      - RUNTIME_ENABLED=${RUNTIME_ENABLED:-docker}
      - DEFAULT_AGENT_IMAGE=${DEFAULT_AGENT_IMAGE:-agent-runtime:latest}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - agent-cloud-network
    volumes:
      - app-logs:/app/logs
      # Docker-out-of-Docker: permite que el backend cree contenedores en el host.
      # ⚠ root-equivalente sobre el host — en prod usar un socket-proxy o k8s+RBAC.
      - /var/run/docker.sock:/var/run/docker.sock

  db:
    image: postgres:16-alpine
    container_name: agent-cloud-db
    environment:
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-postgres}
      - POSTGRES_DB=${DB_NAME:-agent_cloud}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - agent-cloud-network

  redis:
    image: redis:7-alpine
    container_name: agent-cloud-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - agent-cloud-network

networks:
  agent-cloud-network:
    driver: bridge

volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local
  app-logs:
    driver: local