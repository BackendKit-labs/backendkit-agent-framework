nombre: test-agent
configuracion:
  rutas_log:
    - /var/log/app1/*.log
    - /var/log/app2/*.log
  patrones_error:
    - nombre: fatal-error
      regex: "FATAL.*Exception"
      severidad: CRITICAL
      modulo: app-core
    - nombre: db-timeout
      regex: "timeout.*database"
      severidad: HIGH
      modulo: database
  suite_pruebas: /tests/suite
  umbrales:
    max_errores_por_minuto: 50
    max_tiempo_respuesta_ms: 3000
    max_fallos_consecutivos: 5
  programacion: "0 */6 * * *"
  notificaciones:
    email: true
    webhook: false
