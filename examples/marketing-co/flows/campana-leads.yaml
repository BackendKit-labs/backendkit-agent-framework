version: 2
id: campana-leads
name: "Campaña de Generación de Leads"
description: >
  Diseño completo de una campaña de lead generation: estrategia, copies,
  optimización SEO del contenido ancla, y plan de medición con KPIs y ROI target.

steps:
  - id: s1-estrategia
    agent: campaign-agent
    capability: execute
    task: "Diseñar la estrategia completa de la campaña: objetivo SMART, ICP, canales, presupuesto y cronograma"
    depends_on: []
    gate: true
    gate_criteria:
      - "El objetivo SMART tiene número concreto de leads y CPL máximo definido"
      - "El ICP está definido con criterios de calificación claros"
      - "El presupuesto por canal está distribuido y justificado"
      - "El journey del lead cubre desde el primer contacto hasta el cierre"

  - id: s2-copies
    agent: copywriter
    capability: execute
    task: "Redactar todos los copies necesarios: anuncios, landing page, email de bienvenida y secuencia de nurturing"
    depends_on: [s1-estrategia]

  - id: s3-seo-contenido
    agent: seo-agent
    capability: execute
    task: "Optimizar el contenido ancla para SEO: keywords priorizadas, estructura de la landing, meta tags y link building"
    depends_on: [s1-estrategia]

  - id: s4-metricas
    agent: analytics-agent
    capability: execute
    task: "Definir el plan de medición completo: KPIs primarios, tracking setup, dashboard semanal, criterios de optimización y ROI target"
    depends_on: [s2-copies, s3-seo-contenido]
