version: 1

orchestrator:
  name: "Coder v2 Orchestrator"
  provider: deepseek
  vault:
    path: ~/.backendkit/vaults/agent-framework
    embedder: simple

providers:
  deepseek:
    api_key: ${DEEPSEEK_API_KEY}
    base_url: https://api.deepseek.com/v1
    model: deepseek-chat

agents:
  - id: backend-mcp
    name: Backend Specialist
    description: Implements code phase by phase from the ROADMAP. Reads spec/roadmap, writes files directly via write_file tool.
    capabilities: [implementation, coding, backend, typescript]
    provider: deepseek
    domain: backend
    soul_file: souls/backend.md
    gate: false
    transport:
      type: stdio
      command: node
      args: ["../backend-mcp/dist/server.js"]
      env:
        LLM_PROVIDER: deepseek
        LLM_MODEL: deepseek-chat
        DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}

  - id: qa-mcp
    name: QA Specialist
    description: Validates code against specification.md independently using deepseek-reasoner. Reads files directly, writes qa-phaseN.md report.
    capabilities: [validation, testing, qa, code-review]
    provider: deepseek
    domain: qa
    soul_file: souls/qa.md
    gate: true
    gate_criteria:
      - "All functional criteria from specification.md are met"
      - "ADRs from design.md are respected"
      - "Code follows best practices and is maintainable"
      - "Tests are present and cover the implemented functionality"
    transport:
      type: stdio
      command: node
      args: ["../qa-mcp/dist/server.js"]
      env:
        LLM_PROVIDER: deepseek
        LLM_MODEL: deepseek-reasoner
        DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}

  - id: security-mcp
    name: Security Specialist
    description: Reviews code against OWASP Top 10. Reads files directly, writes security-review.md.
    capabilities: [security, review, owasp, audit]
    provider: deepseek
    domain: security
    soul_file: souls/security.md
    gate: true
    gate_criteria:
      - "No critical or high vulnerabilities found"
      - "Secrets are not hardcoded"
      - "Authentication and authorization are properly implemented"
      - "Input validation is present"
    transport:
      type: stdio
      command: node
      args: ["../security-mcp/dist/server.js"]
      env:
        LLM_PROVIDER: deepseek
        LLM_MODEL: deepseek-chat
        DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}

  - id: infra-mcp
    name: Infrastructure Specialist
    description: Generates Dockerfile, docker-compose.yml, CI/CD pipeline and Kubernetes manifests. Detects stack automatically.
    capabilities: [infrastructure, docker, ci-cd, kubernetes, devops]
    provider: deepseek
    domain: infra
    soul_file: souls/infra.md
    gate: false
    transport:
      type: stdio
      command: node
      args: ["../infra-mcp/dist/server.js"]
      env:
        LLM_PROVIDER: deepseek
        LLM_MODEL: deepseek-chat
        DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}

flows:
  - id: sdd-implement
    name: Spec-Driven Development — Implementation Flow
    description: >
      Executes the full SDD implementation flow:
      Design Review → Backend Implementation → QA Validation → Security Review → Infrastructure
    file: flows/sdd-implement.yaml
    trigger: "sdd|spec.driven|implementar.feature|implement.feature"
