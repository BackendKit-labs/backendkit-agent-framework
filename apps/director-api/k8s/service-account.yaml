apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent-cloud-sa
  namespace: agent-cloud
  labels:
    app: agent-cloud-backend
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: agent-cloud-role
  namespace: agent-cloud
rules:
  # k8s runtime adapter — full lifecycle for agent Deployments and Services
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods", "pods/log", "pods/exec"]
    verbs: ["get", "list", "watch", "create"]
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "create"]
  # read-only for other resources (monitoring, health checks)
  - apiGroups: [""]
    resources: ["configmaps", "secrets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agent-cloud-role-binding
  namespace: agent-cloud
subjects:
  - kind: ServiceAccount
    name: agent-cloud-sa
    namespace: agent-cloud
roleRef:
  kind: Role
  name: agent-cloud-role
  apiGroup: rbac.authorization.k8s.io