name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  ci:
    name: Build · Typecheck · Test
    runs-on: ubuntu-latest

    # A Postgres for the journal tests of agent-flow-sql (SPEC-0028). Throwaway: it lives for this job only. Redis is not here: its
    # integration tests skip themselves when it is not reachable.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: ci-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # npm bug #4828: package-lock.json was generated on Windows and only records the win32
      # rolldown binding, so `npm ci` on Linux leaves vite/vitest (web-ui) without its native
      # binding. Unpack the Linux one at the locked rolldown version straight into node_modules.
      # Not `npm install --no-package-lock`: that re-resolves the whole tree against the registry and
      # replaced locked transitive deps (light-my-request 6.8.1 -> cookie 2, ESM-only, broke agent-web's Jest).
      - name: Install rolldown native binding (linux)
        run: |
          set -euo pipefail
          version=$(node -p "require('rolldown/package.json').version")
          tgz=$(npm pack "@rolldown/binding-linux-x64-gnu@${version}" --silent)
          mkdir -p node_modules/@rolldown/binding-linux-x64-gnu
          tar -xzf "$tgz" -C node_modules/@rolldown/binding-linux-x64-gnu --strip-components=1
          rm -f "$tgz"
          node -e "require('@rolldown/binding-linux-x64-gnu'); console.log('rolldown linux binding', '${version}', 'ok')"

      # ── Build (dependency order) ──────────────────────────────────────────────
      - name: Build agent-protocol
        run: npm run build -w packages/agent-protocol

      - name: Build agent-core
        run: npm run build -w packages/core

      - name: Build agent-providers
        run: npm run build -w packages/providers

      - name: Build agent-sandbox
        run: npm run build -w packages/sandbox

      - name: Build agent-flow-queue
        run: npm run build -w packages/flow-queue

      - name: Build agent-flow-sql
        run: npm run build -w packages/flow-sql

      - name: Build agent-otel
        run: npm run build -w packages/otel

      - name: Build agent-testkit
        run: npm run build -w packages/testkit

      - name: Build agent-coding
        run: npm run build -w packages/coding

      - name: Build agent-enterprise
        run: npm run build -w packages/enterprise

      - name: Build agent-web
        run: npm run build -w packages/web

      - name: Build mcp-server
        run: npm run build -w packages/mcp-server

      - name: Build mcp-connectors
        run: npm run build -w packages/mcp-connectors

      - name: Build create-bk-agent
        run: npm run build -w packages/create-bk-agent

      # ── Typecheck ─────────────────────────────────────────────────────────────
      - name: Typecheck all packages
        run: npm run typecheck --workspaces --if-present

      # ── Test ──────────────────────────────────────────────────────────────────
      # Jest packages run with --coverage so each coverageThreshold gates the build.
      - name: Test (jest, coverage thresholds)
        env:
          # The coverage report transforms every src file, tested or not; the largest packages
          # hits the default ~2 GB heap on the runner.
          NODE_OPTIONS: --max-old-space-size=4096
          TEST_POSTGRES_URL: postgres://postgres:ci-test-only@localhost:5432/postgres
        run: |
          # Run every package and fail at the end, so one run reports all failing packages.
          failed=""
          for d in packages/*/; do
            if [ -f "$d/jest.config.js" ] || [ -f "$d/jest.config.cjs" ]; then
              npm test -w "$d" -- --coverage || failed="$failed $d"
            fi
          done
          if [ -n "$failed" ]; then
            echo "::error::Failing packages:$failed"
            exit 1
          fi

      - name: Test (web-ui)
        run: npm test -w packages/web-ui

  guardrails:
    name: Guardrails (audit · cycles · resilience)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Audit gate (high/critical en produccion)
        run: node scripts/audit-gate.mjs

      - name: Circular dependencies (runtime)
        run: npx --yes madge@8 --circular packages

      - name: Manual retry loops
        run: node scripts/check-resilience.mjs
