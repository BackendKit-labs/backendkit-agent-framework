name: backendkit-platform

# ── Shared network ────────────────────────────────────────────────────────────
networks:
  platform:
    driver: bridge

# ── Persistent volumes ────────────────────────────────────────────────────────
volumes:
  postgres_abac:
  postgres_director:
  postgres_cloud:
  redis_data:
  vault_data:

# ── Services ──────────────────────────────────────────────────────────────────
services:

  # ── Infrastructure ──────────────────────────────────────────────────────────

  postgres-abac:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: abac_user
      POSTGRES_PASSWORD: ${ABAC_DB_PASSWORD:-change_me}
      POSTGRES_DB: abac_db
    volumes:
      - postgres_abac:/var/lib/postgresql/data
    networks: [platform]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U abac_user -d abac_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-director:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: director_user
      POSTGRES_PASSWORD: ${DIRECTOR_DB_PASSWORD:-change_me}
      POSTGRES_DB: director_db
    volumes:
      - postgres_director:/var/lib/postgresql/data
    networks: [platform]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U director_user -d director_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-cloud:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cloud_user
      POSTGRES_PASSWORD: ${CLOUD_DB_PASSWORD:-change_me}
      POSTGRES_DB: cloud_platform
    volumes:
      - postgres_cloud:/var/lib/postgresql/data
    networks: [platform]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloud_user -d cloud_platform"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    networks: [platform]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Backend services ─────────────────────────────────────────────────────────

  abac-service:
    build:
      context: ./apps/abac-service
      dockerfile: Dockerfile
    ports:
      - "3005:3005"
    environment:
      NODE_ENV: production
      PORT: 3005
      DB_HOST: postgres-abac
      DB_PORT: 5432
      DB_USERNAME: abac_user
      DB_PASSWORD: ${ABAC_DB_PASSWORD:-change_me}
      DB_NAME: abac_db
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      ED25519_PRIVATE_KEY: ${ED25519_PRIVATE_KEY:?ED25519_PRIVATE_KEY is required}
      ED25519_PUBLIC_KEY: ${ED25519_PUBLIC_KEY:?ED25519_PUBLIC_KEY is required}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:3001,http://localhost:3002}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
    depends_on:
      postgres-abac:
        condition: service_healthy
    networks: [platform]
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3005/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    restart: unless-stopped

  director-api:
    build:
      context: ./apps/director-api
      dockerfile: Dockerfile
    ports:
      - "4000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: postgres-director
      DB_PORT: 5432
      DB_NAME: director_db
      DB_USER: director_user
      DB_PASSWORD: ${DIRECTOR_DB_PASSWORD:-change_me}
      ABAC_PUBLIC_KEY: ${ED25519_PUBLIC_KEY:?ED25519_PUBLIC_KEY is required}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3001,http://localhost:3002}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      postgres-director:
        condition: service_healthy
      abac-service:
        condition: service_healthy
    networks: [platform]
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    restart: unless-stopped

  cloud-platform:
    build:
      context: ./apps/cloud-platform
      dockerfile: Dockerfile
    ports:
      - "3100:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_USER: cloud_user
      DB_PASSWORD: ${CLOUD_DB_PASSWORD:-change_me}
      DB_NAME: cloud_platform
      DB_PORT: 5432
      DATABASE_URL: postgresql://cloud_user:${CLOUD_DB_PASSWORD:-change_me}@postgres-cloud:5432/cloud_platform
      ABAC_PUBLIC_KEY: ${ED25519_PUBLIC_KEY:?ED25519_PUBLIC_KEY is required}
      ABAC_BASE_URL: http://abac-service:3005
      ABAC_M2M_TOKEN: ${CLOUD_M2M_TOKEN:-}
      ABAC_APP_ID: ${CLOUD_APP_ID:-}
      REDIS_URL: redis://redis:6379
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      postgres-cloud:
        condition: service_healthy
      abac-service:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [platform]
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    restart: unless-stopped

  # ── Frontend services ────────────────────────────────────────────────────────

  agent-studio:
    build:
      context: ./apps/agent-studio
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: production
      PORT: 3001
      GATEWAY_URL: http://director-api:3000
      DIRECTOR_URL: http://director-api:3000
      ABAC_URL: http://abac-service:3005
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?NEXTAUTH_SECRET is required}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3001}
    depends_on:
      director-api:
        condition: service_healthy
      abac-service:
        condition: service_healthy
    networks: [platform]
    restart: unless-stopped

  director-chat:
    build:
      context: ./apps/director-chat
      dockerfile: Dockerfile
    ports:
      - "3002:3002"
    environment:
      NODE_ENV: production
      PORT: 3002
      ABAC_URL: http://abac-service:3005
      DIRECTOR_URL: http://director-api:3000
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:3500}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?NEXTAUTH_SECRET is required}
      NEXTAUTH_URL: ${DIRECTOR_CHAT_URL:-http://localhost:3002}
    depends_on:
      director-api:
        condition: service_healthy
      abac-service:
        condition: service_healthy
    networks: [platform]
    restart: unless-stopped

  vault-manager:
    build:
      context: ./apps/vault-manager
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?NEXTAUTH_SECRET is required}
      ABAC_URL: http://abac-service:3005
      DATABASE_URL: file:/data/vault-manager.db
    volumes:
      - vault_data:/data
    depends_on:
      abac-service:
        condition: service_healthy
    networks: [platform]
    restart: unless-stopped

  abac-admin:
    build:
      context: ./apps/abac-admin
      dockerfile: Dockerfile
      args:
        VITE_ABAC_API_URL: ${ABAC_ADMIN_API_URL:-http://localhost:3005}
    ports:
      - "3003:3003"
    depends_on:
      abac-service:
        condition: service_healthy
    networks: [platform]
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3003/ || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3
    restart: unless-stopped
