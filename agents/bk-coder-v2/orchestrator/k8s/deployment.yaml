apiVersion: apps/v1
kind: Deployment
metadata:
  name: orchestrator-coder-v2
  labels:
    app: orchestrator-coder-v2
spec:
  replicas: 2
  selector:
    matchLabels:
      app: orchestrator-coder-v2
  template:
    metadata:
      labels:
        app: orchestrator-coder-v2
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: app
          image: ghcr.io/backendkit-labs/orchestrator-coder-v2:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: orchestrator-config
          env:
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: orchestrator-secrets
                  key: REDIS_URL
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "250m"
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop:
                - ALL
