# ============================================================
# Finance Agent — Kubernetes ConfigMap
# ============================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: finance-agent-config
  namespace: finance
data:
  NODE_ENV: "production"
  LOG_LEVEL: "info"
  DEEPSEEK_BASE_URL: "https://api.deepseek.com/v1"
  DEEPSEEK_MODEL: "deepseek-chat"
  MAX_CONCURRENT_AGENTS: "4"
  TIMEOUT_MS: "30000"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: finance-agent-config-files
  namespace: finance
data:
  orchestrator.yaml: |
    version: 2

    orchestrator:
      name: finance-agent
      data_dir: .finance-agent-data

    agents:
      - id: backend-mcp
        description: Backend specialist
        transport: http
        strategy: round-robin
        capability: execute
        image: mcp/finance-agent/backend:latest
        instances:
          - url: http://localhost:3310

      - id: qa-mcp
        description: QA specialist
        transport: http
        strategy: round-robin
        capability: gate
        image: mcp/finance-agent/qa:latest
        instances:
          - url: http://localhost:3311

      - id: design-mcp
        description: Design specialist
        transport: http
        strategy: round-robin
        capability: execute
        image: mcp/finance-agent/design:latest
        instances:
          - url: http://localhost:3312

    settings:
      maxConcurrentFlows: 3