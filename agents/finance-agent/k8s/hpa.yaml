# ============================================================
# Finance Agent — Horizontal Pod Autoscaler
# ============================================================
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: finance-agent
  namespace: finance
  labels:
    app: finance-agent
    version: "1.0.0"
    tier: backend
    team: finance
    environment: production
    cost-center: fin-ops
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: finance-agent
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
