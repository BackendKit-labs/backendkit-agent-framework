# ============================================================
# Finance Agent — Network Policies
# ============================================================
# Implements defense-in-depth: deny all ingress by default,
# then allow only what's needed.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: finance
  labels:
    app: finance-agent
    tier: backend
    team: finance
    environment: production
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-controller
  namespace: finance
  labels:
    app: finance-agent
    tier: backend
    team: finance
    environment: production
spec:
  podSelector:
    matchLabels:
      app: finance-agent
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - port: 3000
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-redis-from-app
  namespace: finance
  labels:
    app: finance-agent
    tier: backend
    team: finance
    environment: production
spec:
  podSelector:
    matchLabels:
      app: redis
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: finance-agent
      ports:
        - port: 6379
          protocol: TCP
