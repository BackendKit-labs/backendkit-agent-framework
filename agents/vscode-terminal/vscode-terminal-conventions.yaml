name: vscode-terminal-conventions
version: "1.0"
description: "Convenciones específicas del proyecto vscode-terminal"
triggers:
  - vscode-terminal
  - backendkit-console
  - director-console
  - vs-code-fork
  - chat-first
  - workbench
  - mcp-client
  - webview
