# Director Agent — configuración del ecosistema
#
# El director se conecta a los agentes especialistas vía MCP (stdio) y le da
# al LLM todas sus herramientas para que rutee. El LLM es configurable: cambiá
# `director.provider` para usar otro modelo sin tocar código.

director:
  name: Director
  provider: deepseek          # ← deepseek | openai | ollama  (claude requiere adapter Anthropic, ver provider.ts)
  ws_port: 3500               # AgentServer WebSocket (front-door de chat)
  max_iterations: 20

# Proveedores LLM (OpenAI-compatible). El director usa el de `director.provider`.
providers:
  deepseek:
    base_url: https://api.deepseek.com
    model: deepseek-reasoner
    api_key: ${DEEPSEEK_API_KEY}
  openai:
    base_url: https://api.openai.com/v1
    model: gpt-4o
    api_key: ${OPENAI_API_KEY}
  ollama:
    base_url: http://localhost:11434/v1
    model: qwen2.5-coder
    api_key: ollama

# Agentes conectados al director via MCP stdio.
# Paths relativos a este archivo. Descomentá a medida que estén listos.
#
# Arquitectura de conexión:
#   codex       → codex-context-agent-v2  (vault RAG, sin Ollama)
#   runs        → orchestrator-mcp-agent  (flows, runs, gates — MCP directo, sin gateway)
#   fleet       → fleet-agent             (deploy Docker/K8s — vía gateway :3400)
#   coder       → bk-agent --mcp          (código, spec-driven, QA)
agents:
  - name: codex
    command: node
    args: ["../codex-context-agent-v2/dist/server.js"]
    env:
      CODEX_API_KEY: ${DEEPSEEK_API_KEY}
      CODEX_PROVIDER: deepseek

  - name: runs                  # Orquestación: flows, runs, gates, config — MCP directo
    command: node
    args: ["../orchestrator-mcp-agent/dist/server.js"]
    env:
      # Uses ~/.backendkit/config/orchestrator-mcp.yaml by default (created by initBkHome).
      # Override with ORCHESTRATOR_CONFIG env var to point to a custom config.
      ORCHESTRATOR_CONFIG: ${ORCHESTRATOR_CONFIG}

  - name: fleet                 # Deploy Docker/K8s — vía gateway HTTP :3400
    command: node
    args: ["../fleet-agent/dist/server.js"]
    env:
      GATEWAY_URL: ${GATEWAY_URL}
      GATEWAY_API_KEY: ${GATEWAY_API_KEY}

  - name: coder                 # bk-coder-v2 — Orchestrator V2 (SDD: backend, QA, security, infra)
    command: node
    args: ["../bk-coder-v2/orchestrator/dist/server.js"]
    env:
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      # config_path se pasa como argumento en cada tool call (soporta múltiples proyectos)

  - name: project               # Workspace Manager PROJECT — proyectos, root, config de agentes
    command: node
    args: ["../bk-coder-v2/workspace-manager-project/dist/server.js"]
    # Persiste en ~/.backendkit/projects.json — el coder resuelve el proyecto activo desde acá

  - name: config                # Gestión centralizada de config + secretos de todos los agentes
    command: node
    args: ["../config-agent/dist/config-agent.js"]
    env:
      CONFIG_MASTER_KEY: ${CONFIG_MASTER_KEY}
      # CONFIG_DATA_DIR: ~/.backendkit/config   ← default

  - name: scheduler             # Scheduling de tareas one-time y cron → ejecuta flows del orquestador
    command: node
    args: ["../schedule-agent/dist/index.js"]
    env:
      ORCHESTRATOR_URL: ${ORCHESTRATOR_URL}
      # SCHEDULER_DB_PATH: ~/.backendkit/scheduler/tasks.db   ← default

  - name: health                # Salud del ecosistema completo (orquestador, agentes, env, vault, broker)
    command: npx
    args: ["tsx", "../health-checker/health-checker.ts"]
    env:
      ORCHESTRATOR_URL: ${ORCHESTRATOR_URL}
      # BROKER_URL: redis://localhost:6379   ← opcional

  - name: notifier              # Notificaciones multi-canal (email, Slack, Telegram, Discord, push)
    command: npx
    args: ["tsx", "../notification-agent/src/notification-agent.ts"]
    env:
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SCHEDULER_URL: ${SCHEDULER_URL}

# ── Control de acceso (Capa 1 + 2) ───────────────────────────────────────────
#
# enforce: false  → bypass total (dev/REPL). Cambiar a true en producción.
# default_deny:   → qué hacer con tools sin política (false = permite, true = deniega)
# JWT_SECRET env var controla si se exige autenticación por token (ver .env.example)
#
# Roles de ejemplo:
#   admin     — acceso total
#   dev       — lectura + curación
#   tech-lead — lectura + curación
#   hr        — lectura de vault + flows de RR.HH.
#   sales     — lectura de vault
#   finance   — lectura de vault
#   devops    — curación + deploy + infra
access_control:
  enforce: true
  default_deny: false     # herramientas sin política → permitidas (permissive)

  # ── Capa 5: auditoría ───────────────────────────────────────────────────────
  # Log NDJSON (una entrada JSON por línea) en ~/.backendkit/audit/director-access.ndjson
  # path: opcional — override de la ruta del archivo de log
  audit:
    enabled: true

  # ── Capa 4: aislamiento de datos en el vault ────────────────────────────────
  # Controla qué namespaces (prefijos de path) puede leer cada rol.
  # El prefijo más largo que coincida gana (longest-match).
  # Las notas sin prefijo coincidente usan default_roles.
  vault_visibility:
    default_roles: ["*"]      # notas sin namespace restringido → visibles para todos
    paths:
      "finanzas/":   ["admin", "finance"]
      "rh/":         ["admin", "hr"]
      "ventas/":     ["admin", "sales"]
      "backend/":    ["admin", "dev", "tech-lead", "devops"]
      "infra/":      ["admin", "devops"]
      "config/":     ["admin", "devops"]

  tools:
    # ── Codex (vault RAG) ──────────────────────────────────────────────────────
    search_vault: { allowed_roles: ["*"] }
    vault_status: { allowed_roles: ["*"] }
    read_note:    { allowed_roles: ["*"] }

    curate_path:
      allowed_roles: ["admin", "development", "devops"]
      conditions:
        - effect: deny
          reason: "Curación de paths deshabilitada en fin de semana para roles no-admin"
          match:
            all:
              - { user: role, neq: admin }
              - { time: weekday, in: [0, 6] }

    curate_link:
      allowed_roles: ["admin", "development", "devops"]
      conditions:
        - effect: deny
          reason: "Curación de links deshabilitada en fin de semana para roles no-admin"
          match:
            all:
              - { user: role, neq: admin }
              - { time: weekday, in: [0, 6] }

    init_embedder: { allowed_roles: ["admin", "devops"] }

    reindex_vault:
      allowed_roles: ["admin", "devops"]
      conditions:
        # Devops solo puede reindexar en horario laboral (8:00–18:00, Lun-Vie)
        - effect: deny
          reason: "Reindexación fuera de horario laboral (Lun-Vie 8:00-18:00) solo permitida para admin"
          match:
            all:
              - { user: role, neq: admin }
              - any:
                  - { time: weekday, in: [0, 6] }
                  - { time: hour, lt: 8 }
                  - { time: hour, gte: 18 }

    clone_vault: { allowed_roles: ["admin", "devops"] }

    reset_vault:
      allowed_roles: ["admin"]
      conditions:
        # Incluso admin: reset bloqueado en fin de semana y fuera de horario laboral
        - effect: deny
          reason: "reset_vault bloqueado fuera del horario laboral (Lun-Vie 8:00-18:00)"
          match:
            any:
              - { time: weekday, in: [0, 6] }
              - { time: hour, lt: 8 }
              - { time: hour, gte: 18 }

    # ── Coder v2 (Orchestrator V2 — SDD flows) ────────────────────────────────
    # config_path es un argumento en cada llamada, no afecta la autorización aquí.
    orchestrator_design:          { allowed_roles: ["admin", "development"] }
    orchestrator_sdd:             { allowed_roles: ["admin", "development"] }
    orchestrator_run:             { allowed_roles: ["admin", "development"] }
    orchestrator_status:
      allowed_roles: ["*"]
      conditions:
        - effect: deny
          reason: "Las herramientas del coder no están disponibles para RR.HH."
          match: { user: role, eq: hr }
    orchestrator_approve:         { allowed_roles: ["admin", "development"] }
    orchestrator_list_agents:
      allowed_roles: ["*"]
      conditions:
        - effect: deny
          reason: "Las herramientas del coder no están disponibles para RR.HH."
          match: { user: role, eq: hr }
    orchestrator_list_runs:       { allowed_roles: ["admin", "development"] }
    orchestrator_reflect:         { allowed_roles: ["admin", "development"] }
    orchestrator_reflect_promote: { allowed_roles: ["admin"] }
    orchestrator_reflect_demote:  { allowed_roles: ["admin"] }

    # ── Workspace Manager PROJECT (proyectos y root) ──────────────────────────
    project_list:             { allowed_roles: ["*"] }
    project_current:          { allowed_roles: ["*"] }
    project_get_root:         { allowed_roles: ["*"] }
    project_get_agent_config: { allowed_roles: ["*"] }
    project_agent_exists:     { allowed_roles: ["*"] }
    project_switch:           { allowed_roles: ["admin", "development"] }
    project_create:           { allowed_roles: ["admin", "development"] }
    project_update:           { allowed_roles: ["admin", "development"] }
    project_duplicate:        { allowed_roles: ["admin", "development"] }
    project_delete:           { allowed_roles: ["admin"] }

    # ── Config (gestión centralizada de configuración) ─────────────────────────
    get_config:
      allowed_roles: ["*"]
      conditions:
        - effect: deny
          reason: "La gestión de configuración no está disponible para RR.HH."
          match: { user: role, eq: hr }
    list_configs:
      allowed_roles: ["*"]
      conditions:
        - effect: deny
          reason: "La gestión de configuración no está disponible para RR.HH."
          match: { user: role, eq: hr }
    get_config_schema:
      allowed_roles: ["*"]
      conditions:
        - effect: deny
          reason: "La gestión de configuración no está disponible para RR.HH."
          match: { user: role, eq: hr }
    validate_config:
      allowed_roles: ["*"]
      conditions:
        - effect: deny
          reason: "La gestión de configuración no está disponible para RR.HH."
          match: { user: role, eq: hr }
    diff_config:       { allowed_roles: ["admin", "development", "devops"] }
    set_config:        { allowed_roles: ["admin", "devops"] }
    set_secret:        { allowed_roles: ["admin"] }
    import_config:     { allowed_roles: ["admin"] }
    restore_config:    { allowed_roles: ["admin"] }
    commit_config:     { allowed_roles: ["admin", "devops"] }
    reload_config:     { allowed_roles: ["admin", "devops"] }
    detect_env:        { allowed_roles: ["admin", "devops"] }
    serve_config_ui:   { allowed_roles: ["admin"] }

    # ── Runs — flows de negocio ────────────────────────────────────────────────
    # run_flow/run_task abiertos a todos; control fino en el orquestador por flow.
    run_flow:   { allowed_roles: ["*"] }
    start_flow: { allowed_roles: ["*"] }
    run_task:   { allowed_roles: ["*"] }
    run_status: { allowed_roles: ["*"] }

    # ── Scheduler (programación de tareas) ─────────────────────────────────────
    schedule_task:     { allowed_roles: ["*"] }
    list_scheduled:    { allowed_roles: ["*"] }
    task_status:       { allowed_roles: ["*"] }
    cancel_task:       { allowed_roles: ["*"] }
    reschedule:        { allowed_roles: ["*"] }
    get_current_time:  { allowed_roles: ["*"] }
    get_user_timezone: { allowed_roles: ["*"] }

    # ── Health (monitoreo del ecosistema) ──────────────────────────────────────
    system_health:    { allowed_roles: ["*"] }
    check_agent:      { allowed_roles: ["*"] }
    check_scheduler:  { allowed_roles: ["*"] }
    check_vault:      { allowed_roles: ["*"] }
    check_environment: { allowed_roles: ["admin", "devops"] }
    check_messaging:  { allowed_roles: ["admin", "devops"] }
    end_to_end_test:  { allowed_roles: ["admin", "devops"] }

    # ── Notifier (notificaciones multi-canal) ──────────────────────────────────
    notify_user:              { allowed_roles: ["*"] }
    send_notification:        { allowed_roles: ["*"] }
    notify_scheduled:         { allowed_roles: ["*"] }
    user_channels:            { allowed_roles: ["*"] }
    list_channels:            { allowed_roles: ["*"] }
    register_device:          { allowed_roles: ["*"] }
    unregister_device:        { allowed_roles: ["*"] }
    test_channel:             { allowed_roles: ["admin", "devops"] }
    get_notification_history: { allowed_roles: ["admin", "hr"] }
    register_user_channels:   { allowed_roles: ["admin", "hr"] }
    list_devices:             { allowed_roles: ["admin", "devops"] }

    # ── Fleet (deploy Docker/K8s) ───────────────────────────────────────────────
    deploy_agent:       { allowed_roles: ["admin", "devops"] }
    stop_agent:         { allowed_roles: ["admin", "devops"] }
    list_deployments:   { allowed_roles: ["admin", "devops", "development"] }
    deploy_settings:    { allowed_roles: ["admin", "devops"] }
    fleet_health:       { allowed_roles: ["*"] }
