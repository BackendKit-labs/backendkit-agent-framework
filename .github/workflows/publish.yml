name: Publish to npm

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # for npm provenance

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Build in dependency order — core must exist before coding/mcp-server can compile
      - name: Build @backendkit-labs/agent-core
        run: npm run build
        working-directory: packages/core

      - name: Build @backendkit-labs/agent-coding
        run: npm run build
        working-directory: packages/coding

      - name: Build @backendkit-labs/mcp-server
        # mcp-server has heavy generic types — needs extra heap to avoid tsc OOM
        run: npm run build
        working-directory: packages/mcp-server
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Run tests
        run: npm run test --workspace packages/core

      - name: Publish @backendkit-labs/agent-core
        run: npm publish --provenance --access public
        working-directory: packages/core
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @backendkit-labs/agent-coding
        run: npm publish --provenance --access public
        working-directory: packages/coding
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @backendkit-labs/mcp-server
        run: npm publish --provenance --access public
        working-directory: packages/mcp-server
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
