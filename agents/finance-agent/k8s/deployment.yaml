# ============================================================
# Finance Agent — Kubernetes Deployment
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: finance-agent
  namespace: finance
  labels:
    app: finance-agent
    version: "1.0.0"
    tier: backend
    team: finance
    environment: production
    cost-center: fin-ops
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: finance-agent
  template:
    metadata:
      labels:
        app: finance-agent
        version: "1.0.0"
        tier: backend
        team: finance
        environment: production
        cost-center: fin-ops
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: finance-agent
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: finance-agent
          image: ghcr.io/your-org/finance-agent:1.0.0
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: finance-agent-config
            - secretRef:
                name: finance-agent-secrets
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3000"
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            successThreshold: 1
          volumeMounts:
            - name: config-volume
              mountPath: /app/config
              readOnly: true
            - name: vault-volume
              mountPath: /app/vault
              readOnly: true
      volumes:
        - name: config-volume
          configMap:
            name: finance-agent-config-files
        - name: vault-volume
          configMap:
            name: finance-agent-vault