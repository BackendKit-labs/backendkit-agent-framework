# ============================================================
# Finance Agent — Kubernetes Service
# ============================================================
apiVersion: v1
kind: Service
metadata:
  name: finance-agent
  namespace: finance
  labels:
    app: finance-agent
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: 3000
      protocol: TCP
      name: http
  selector:
    app: finance-agent