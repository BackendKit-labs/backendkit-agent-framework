name: Docs

# Publishes the documentation site (site/) to GitHub Pages.
# Manual on purpose: run it from the Actions tab once Pages is enabled for the repository
# (Settings -> Pages -> Source: GitHub Actions). Until then nothing here runs on its own.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # `npm install`, not `npm ci`: the lockfile was generated on Windows and the site's bundler has native
      # bindings per platform (npm bug #4828, the same one ci.yml works around), so Linux has to resolve its own.
      - name: Install
        working-directory: site
        run: npm install --no-audit --no-fund

      # Copies the READMEs of the packages into the site, then builds it.
      - name: Build
        working-directory: site
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
