name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Build in dependency order — core must exist before coding/mcp-server can compile.
      # agent-protocol goes first: core's flow tests (compat with the protocol) import its build.
      - name: Build @backendkit-labs/agent-protocol
        run: npm run build
        working-directory: packages/agent-protocol

      - name: Build @backendkit-labs/agent-core
        run: npm run build
        working-directory: packages/core

      - name: Build @backendkit-labs/agent-providers
        run: npm run build
        working-directory: packages/providers

      - name: Build @backendkit-labs/agent-sandbox
        run: npm run build
        working-directory: packages/sandbox

      - name: Build @backendkit-labs/agent-coding
        run: npm run build
        working-directory: packages/coding

      - name: Build @backendkit-labs/mcp-server
        run: npm run build
        working-directory: packages/mcp-server
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Run tests
        run: npm run test --workspace packages/core

  # Manual publish: cd packages/core && npm publish --access public
  # then packages/coding, then packages/mcp-server
