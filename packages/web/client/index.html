<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BackendKit Agent</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f0f0f;
      color: #e8e8e8;
      height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    #header {
      padding: 12px 20px;
      border-bottom: 1px solid #2a2a2a;
      display: flex;
      align-items: center;
      gap: 12px;
      background: #161616;
    }

    #header h1 { font-size: 15px; font-weight: 600; }

    #agent-badge {
      font-size: 12px;
      padding: 2px 8px;
      border-radius: 999px;
      background: #2a2a2a;
      color: #999;
    }

    #status-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #555;
      margin-left: auto;
    }
    #status-dot.connected { background: #22c55e; }
    #status-dot.thinking  { background: #f59e0b; animation: pulse 1s infinite; }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.3; }
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .msg {
      max-width: 720px;
      width: 100%;
      align-self: flex-start;
    }

    .msg.user {
      align-self: flex-end;
    }

    .msg-bubble {
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .msg.user .msg-bubble {
      background: #1d4ed8;
      color: #fff;
      border-bottom-right-radius: 4px;
    }

    .msg.assistant .msg-bubble {
      background: #1e1e1e;
      border: 1px solid #2a2a2a;
      border-bottom-left-radius: 4px;
    }

    .msg-meta {
      font-size: 11px;
      color: #555;
      margin-bottom: 4px;
      padding: 0 4px;
    }

    .tool-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 6px;
      background: #1a1a2e;
      border: 1px solid #2d2d5e;
      color: #818cf8;
      margin: 4px 0;
    }

    .tool-badge.done { border-color: #166534; color: #4ade80; background: #052e16; }
    .tool-badge.error { border-color: #7f1d1d; color: #f87171; background: #2d0000; }

    #input-area {
      padding: 16px 20px;
      border-top: 1px solid #2a2a2a;
      background: #161616;
      display: flex;
      gap: 10px;
    }

    #input {
      flex: 1;
      background: #1e1e1e;
      border: 1px solid #2a2a2a;
      border-radius: 8px;
      padding: 10px 14px;
      color: #e8e8e8;
      font-size: 14px;
      resize: none;
      outline: none;
      min-height: 44px;
      max-height: 160px;
      font-family: inherit;
    }

    #input:focus { border-color: #3b82f6; }

    #send-btn {
      background: #1d4ed8;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 0 18px;
      font-size: 14px;
      cursor: pointer;
      font-weight: 500;
      height: 44px;
      white-space: nowrap;
    }

    #send-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    #send-btn:hover:not(:disabled) { background: #1e40af; }

    #abort-btn {
      background: transparent;
      color: #f87171;
      border: 1px solid #7f1d1d;
      border-radius: 8px;
      padding: 0 14px;
      font-size: 13px;
      cursor: pointer;
      height: 44px;
      display: none;
    }
    #abort-btn.visible { display: block; }
    #abort-btn:hover { background: #2d0000; }

    #connect-bar {
      padding: 10px 20px;
      background: #1a1a1a;
      border-bottom: 1px solid #2a2a2a;
      display: flex;
      gap: 8px;
      align-items: center;
      font-size: 13px;
    }

    #server-url {
      flex: 1;
      background: #1e1e1e;
      border: 1px solid #2a2a2a;
      border-radius: 6px;
      padding: 6px 10px;
      color: #e8e8e8;
      font-size: 13px;
      outline: none;
    }

    #connect-btn {
      background: #065f46;
      color: #34d399;
      border: 1px solid #065f46;
      border-radius: 6px;
      padding: 6px 14px;
      cursor: pointer;
      font-size: 13px;
    }
    #connect-btn:hover { background: #047857; }
  </style>
</head>
<body>

<div id="header">
  <h1>BackendKit Agent</h1>
  <span id="agent-badge">–</span>
  <div id="status-dot" title="Disconnected"></div>
</div>

<div id="connect-bar">
  <input id="server-url" type="text" value="ws://localhost:4000/chat" spellcheck="false" />
  <button id="connect-btn" onclick="connect()">Connect</button>
</div>

<div id="messages"></div>

<div id="input-area">
  <textarea id="input" placeholder="Send a message…" rows="1" disabled></textarea>
  <button id="abort-btn" onclick="abort()">Stop</button>
  <button id="send-btn" onclick="sendMessage()" disabled>Send</button>
</div>

<script>
  let ws = null;
  let sessionId = null;
  let currentAssistantMsg = null;
  let isRunning = false;

  const messagesEl  = document.getElementById('messages');
  const inputEl     = document.getElementById('input');
  const sendBtn     = document.getElementById('send-btn');
  const abortBtn    = document.getElementById('abort-btn');
  const statusDot   = document.getElementById('status-dot');
  const agentBadge  = document.getElementById('agent-badge');
  const connectBtn  = document.getElementById('connect-btn');

  function connect() {
    const url = document.getElementById('server-url').value.trim();
    if (ws) { ws.close(); ws = null; }

    addSystemMsg(`Connecting to ${url}…`);
    ws = new WebSocket(url);

    ws.onopen = () => {
      statusDot.className = 'connected';
      statusDot.title = 'Connected';
    };

    ws.onclose = () => {
      statusDot.className = '';
      statusDot.title = 'Disconnected';
      inputEl.disabled = true;
      sendBtn.disabled = true;
      setRunning(false);
      addSystemMsg('Disconnected.');
    };

    ws.onerror = () => addSystemMsg('WebSocket error.');

    ws.onmessage = (e) => {
      const evt = JSON.parse(e.data);
      handleEvent(evt);
    };
  }

  function handleEvent(evt) {
    switch (evt.type) {
      case 'session_created':
        sessionId = evt.sessionId;
        inputEl.disabled = false;
        sendBtn.disabled = false;
        addSystemMsg(`Session: ${sessionId.slice(0, 8)}…`);
        break;

      case 'ready':
        setRunning(false);
        currentAssistantMsg = null;
        break;

      case 'token':
        if (!currentAssistantMsg) currentAssistantMsg = addAssistantMsg();
        currentAssistantMsg.textContent += evt.content;
        scrollToBottom();
        break;

      case 'tool_call':
        currentAssistantMsg = null;
        addToolBadge(`⚙ ${evt.name}${evt.args_preview ? ` — ${evt.args_preview}` : ''}`, 'pending');
        break;

      case 'tool_result': {
        const last = messagesEl.querySelector('.tool-badge:last-child');
        if (last) last.className = `tool-badge ${evt.success ? 'done' : 'error'}`;
        break;
      }

      case 'agent_switch':
        agentBadge.textContent = `${evt.to_icon ?? ''} ${evt.to_name ?? evt.to}`.trim();
        currentAssistantMsg = null;
        break;

      case 'block_start':
        agentBadge.textContent = `${evt.agent_icon ?? ''} ${evt.agent_name ?? evt.agent_id}`.trim();
        break;

      case 'thinking':
        addSystemMsg(`💭 ${evt.label}`);
        break;

      case 'done':
        setRunning(false);
        currentAssistantMsg = null;
        break;

      case 'error':
        setRunning(false);
        addSystemMsg(`Error: ${evt.message}`, true);
        currentAssistantMsg = null;
        break;

      case 'system':
        addSystemMsg(evt.text, evt.level === 'error');
        break;

      case 'metrics':
        addSystemMsg(`Tokens: ${evt.input_tokens} in / ${evt.output_tokens} out${evt.cost_usd != null ? ` · $${evt.cost_usd.toFixed(4)}` : ''}`);
        break;
    }
  }

  function sendMessage() {
    const content = inputEl.value.trim();
    if (!content || !ws || isRunning) return;

    addUserMsg(content);
    inputEl.value = '';
    inputEl.style.height = 'auto';
    setRunning(true);

    ws.send(JSON.stringify({ type: 'input', content }));
  }

  function abort() {
    if (ws) ws.send(JSON.stringify({ type: 'abort' }));
    setRunning(false);
  }

  function setRunning(running) {
    isRunning = running;
    sendBtn.disabled = running;
    abortBtn.className = running ? 'visible' : '';
    statusDot.className = running ? 'thinking connected' : 'connected';
  }

  // ── DOM helpers ──────────────────────────────────────────────────────────

  function addUserMsg(text) {
    const div = document.createElement('div');
    div.className = 'msg user';
    div.innerHTML = `<div class="msg-bubble">${escHtml(text)}</div>`;
    messagesEl.appendChild(div);
    scrollToBottom();
  }

  function addAssistantMsg() {
    const div = document.createElement('div');
    div.className = 'msg assistant';
    const meta = agentBadge.textContent !== '–' ? `<div class="msg-meta">${escHtml(agentBadge.textContent)}</div>` : '';
    div.innerHTML = `${meta}<div class="msg-bubble"></div>`;
    messagesEl.appendChild(div);
    scrollToBottom();
    return div.querySelector('.msg-bubble');
  }

  function addToolBadge(label, state) {
    const span = document.createElement('span');
    span.className = `tool-badge ${state}`;
    span.textContent = label;
    const wrap = document.createElement('div');
    wrap.className = 'msg assistant';
    wrap.appendChild(span);
    messagesEl.appendChild(wrap);
    scrollToBottom();
  }

  function addSystemMsg(text, isError = false) {
    const div = document.createElement('div');
    div.style.cssText = `font-size:12px;color:${isError ? '#f87171' : '#555'};padding:2px 4px;text-align:center`;
    div.textContent = text;
    messagesEl.appendChild(div);
    scrollToBottom();
  }

  function scrollToBottom() {
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function escHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  // ── Keyboard shortcuts ────────────────────────────────────────────────────

  inputEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  inputEl.addEventListener('input', () => {
    inputEl.style.height = 'auto';
    inputEl.style.height = Math.min(inputEl.scrollHeight, 160) + 'px';
  });
</script>
</body>
</html>
