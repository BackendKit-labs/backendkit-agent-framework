# ============================================================
# orchestrator-mcp.yaml — EJEMPLO COMPLETO CON TODOS LOS CAMPOS
# ============================================================
# Copia este archivo, renombralo a orchestrator-mcp.yaml,
# ajustá los valores y apuntá ORCHESTRATOR_CONFIG a él.

version: 2

# ── Orquestador ───────────────────────────────────────────────────────────────
orchestrator:
  name: "Mi Orquestador"

  # Dónde guardar el SQLite de runs. Relativo al archivo yaml.
  # Default: .orchestrator-mcp/  (si se omite)
  data_dir: ".orchestrator-mcp-data"

  # Tenant para multi-tenancy; se pasa a cada agente en el contexto.
  # Omitir si no usás multi-tenancy.
  tenant_id: "acme-corp"

  # API key global para agentes que usan agent-protocol auth.
  # Se puede sobreescribir por instancia en agents[].instances[].apiKey
  api_key: "${GLOBAL_AGENT_API_KEY}"

  # Vault de conocimiento (opcional — solo si usás RAG interno).
  vault:
    path: ./vault          # carpeta con archivos .md indexados
    embedder: simple       # simple (TF-IDF) | ollama (embeddings semánticos)


# ── Agentes ───────────────────────────────────────────────────────────────────
# Cada agente es un servicio HTTP que implementa el agent-protocol.
# El id es el nombre que usás en los flows (steps[].agent).

agents:

  # ── Agente básico ─────────────────────────────────────────────────────────
  - id: triage
    description: "Clasifica preguntas y extrae queries de búsqueda"

    transport: http          # http (default) | stdio (futuro)
    strategy: round-robin    # round-robin | least-busy | random | failover

    # Timeout de la llamada HTTP en ms. Default: 30000 (30s).
    # Aumentar para agentes LLM que tardan más.
    timeout: 45000

    # Capability default: qué endpoint llamar en el agente.
    # El agente expone POST /execute, /analyze, /generate, etc.
    # Se puede sobreescribir por step en el flow.
    capability: execute

    # Pool de instancias — si hay varias, strategy decide cuál usar.
    instances:
      - url: "http://localhost:${TRIAGE_PORT}"
        apiKey: "${TRIAGE_API_KEY}"    # sobreescribe el api_key global para este agente

  # ── Agente con múltiples instancias (pool / HA) ───────────────────────────
  - id: curator
    description: "Busca en el vault (alta disponibilidad con 2 instancias)"
    transport: http
    strategy: least-busy     # elige la instancia con menos requests en vuelo
    timeout: 30000
    capability: execute
    instances:
      - url: "http://localhost:3200"
        apiKey: "${CURATOR_API_KEY}"
      - url: "http://localhost:3201"   # segunda instancia para HA
        apiKey: "${CURATOR_API_KEY}"

  # ── Agente LLM con gate de aprobación humana ──────────────────────────────
  - id: synthesizer
    description: "Sintetiza resultados usando LLM (planner + writer)"
    transport: http
    strategy: round-robin
    timeout: 120000          # 2 min — los LLMs pueden tardar
    capability: execute

    # gate: true en el AGENTE significa que TODOS los steps que usen
    # este agente pausarán para aprobación, salvo que el step lo sobreescriba.
    # Alternativa: poner gate: true en el step del flow (más granular).
    gate: false

    # gate_criteria del agente: se usan si el step no define los propios.
    gate_criteria:
      - "La respuesta está fundamentada en los resultados del vault"
      - "No hay alucinaciones evidentes"

    instances:
      - url: "http://localhost:${SYNTHESIZER_PORT}"

  # ── Agente con failover (primary → secondary) ─────────────────────────────
  - id: formatter
    description: "Formatea resultados en markdown"
    transport: http
    strategy: failover       # usa la primera instancia; si falla, pasa a la siguiente
    timeout: 15000
    capability: execute
    instances:
      - url: "http://localhost:3302"   # primary
      - url: "http://localhost:3303"   # secondary (failover)


# ── Flows ─────────────────────────────────────────────────────────────────────
# Lista de workflows disponibles. El archivo YAML de cada flow
# se carga desde una ruta relativa a este archivo.

flows:
  - id: knowledge-search
    file: flows/knowledge-search.yaml
    # trigger: regex (case-insensitive) para auto-matching con run_task.
    # Si usás start_flow o run_flow con flow_id explícito, el trigger se ignora.
    trigger: "buscar|search|how|what|explain|qué|cómo"

  - id: knowledge-search-llm
    file: flows/knowledge-search-llm.yaml
    trigger: "sintetiza|synthesize|responde|analiza|elabora"

  # Flow sin trigger — solo se llama con flow_id explícito (start_flow / run_flow)
  - id: onboarding-empleado
    file: flows/onboarding-empleado.yaml
