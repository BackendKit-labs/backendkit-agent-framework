# Director Agent — configuración del ecosistema
#
# El director se conecta a los agentes especialistas vía MCP (stdio) y le da
# al LLM todas sus herramientas para que rutee. El LLM es configurable: cambiá
# `director.provider` para usar otro modelo sin tocar código.

director:
  name: Director
  provider: deepseek          # ← deepseek | openai | ollama  (claude requiere adapter Anthropic, ver provider.ts)
  ws_port: 3500               # AgentServer WebSocket (front-door de chat)
  max_iterations: 20

# Proveedores LLM (OpenAI-compatible). El director usa el de `director.provider`.
providers:
  deepseek:
    base_url: https://api.deepseek.com
    model: deepseek-reasoner
    api_key: ${DEEPSEEK_API_KEY}
  openai:
    base_url: https://api.openai.com/v1
    model: gpt-4o
    api_key: ${OPENAI_API_KEY}
  ollama:
    base_url: http://localhost:11434/v1
    model: qwen2.5-coder
    api_key: ollama

# Agentes conectados al director via MCP stdio.
# Paths relativos a este archivo. Descomentá a medida que estén listos.
#
# Arquitectura de conexión:
#   codex       → codex-context-agent-v2  (vault RAG, sin Ollama)
#   runs        → orchestrator-mcp-agent  (flows, runs, gates — MCP directo, sin gateway)
#   fleet       → fleet-agent             (deploy Docker/K8s — vía gateway :3400)
#   coder       → bk-agent --mcp          (código, spec-driven, QA)
agents:
  - name: codex
    command: node
    args: ["../codex-context-agent-v2/dist/server.js"]
    env:
      CODEX_API_KEY: ${DEEPSEEK_API_KEY}
      CODEX_PROVIDER: deepseek

  - name: runs                  # Orquestación: flows, runs, gates, config — MCP directo
    command: node
    args: ["../orchestrator-mcp-agent/dist/server.js"]
    env:
      # Uses ~/.backendkit/config/orchestrator-mcp.yaml by default (created by initBkHome).
      # Override with ORCHESTRATOR_CONFIG env var to point to a custom config.
      ORCHESTRATOR_CONFIG: ${ORCHESTRATOR_CONFIG}

  - name: fleet                 # Deploy Docker/K8s — vía gateway HTTP :3400
    command: node
    args: ["../fleet-agent/dist/server.js"]
    env:
      GATEWAY_URL: ${GATEWAY_URL}
      GATEWAY_API_KEY: ${GATEWAY_API_KEY}

  # - name: coder               # Código — bk-agent (requiere modo --mcp, pendiente)
  #   command: node
  #   args: ["../../apps/bk-agent/dist/bin/cli.js", "--mcp"]
  #   env:
  #     DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}

# ── Control de acceso (Capa 1 + 2) ───────────────────────────────────────────
#
# enforce: false  → bypass total (dev/REPL). Cambiar a true en producción.
# default_deny:   → qué hacer con tools sin política (false = permite, true = deniega)
# JWT_SECRET env var controla si se exige autenticación por token (ver .env.example)
#
# Roles de ejemplo:
#   admin     — acceso total
#   dev       — lectura + curación
#   tech-lead — lectura + curación
#   hr        — lectura de vault + flows de RR.HH.
#   sales     — lectura de vault
#   finance   — lectura de vault
#   devops    — curación + deploy + infra
access_control:
  enforce: true
  default_deny: false     # herramientas sin política → permitidas (permissive)

  # ── Capa 5: auditoría ───────────────────────────────────────────────────────
  # Log NDJSON (una entrada JSON por línea) en ~/.backendkit/audit/director-access.ndjson
  # path: opcional — override de la ruta del archivo de log
  audit:
    enabled: true

  # ── Capa 4: aislamiento de datos en el vault ────────────────────────────────
  # Controla qué namespaces (prefijos de path) puede leer cada rol.
  # El prefijo más largo que coincida gana (longest-match).
  # Las notas sin prefijo coincidente usan default_roles.
  vault_visibility:
    default_roles: ["*"]      # notas sin namespace restringido → visibles para todos
    paths:
      "finanzas/":   ["admin", "finance"]
      "rh/":         ["admin", "hr"]
      "ventas/":     ["admin", "sales"]
      "backend/":    ["admin", "dev", "tech-lead", "devops"]
      "infra/":      ["admin", "devops"]
      "config/":     ["admin", "devops"]

  tools:
    # ── Codex (vault RAG) ──────────────────────────────────────────────────────
    search_vault: { allowed_roles: ["*"] }
    vault_status: { allowed_roles: ["*"] }
    read_note:    { allowed_roles: ["*"] }

    curate_path:
      allowed_roles: ["admin", "dev", "tech-lead"]
      conditions:
        # Dev y tech-lead no pueden curar en fin de semana (weekday 0=Dom, 6=Sáb)
        - effect: deny
          reason: "Curación de paths deshabilitada en fin de semana para roles no-admin"
          match:
            all:
              - { user: role, neq: admin }
              - { time: weekday, in: [0, 6] }

    curate_link:
      allowed_roles: ["admin", "dev", "tech-lead"]
      conditions:
        - effect: deny
          reason: "Curación de links deshabilitada en fin de semana para roles no-admin"
          match:
            all:
              - { user: role, neq: admin }
              - { time: weekday, in: [0, 6] }

    init_embedder: { allowed_roles: ["admin", "devops"] }

    reindex_vault:
      allowed_roles: ["admin", "devops"]
      conditions:
        # Devops solo puede reindexar en horario laboral (8:00–18:00, Lun-Vie)
        - effect: deny
          reason: "Reindexación fuera de horario laboral (Lun-Vie 8:00-18:00) solo permitida para admin"
          match:
            all:
              - { user: role, neq: admin }
              - any:
                  - { time: weekday, in: [0, 6] }
                  - { time: hour, lt: 8 }
                  - { time: hour, gte: 18 }

    clone_vault: { allowed_roles: ["admin", "devops"] }

    reset_vault:
      allowed_roles: ["admin"]
      conditions:
        # Incluso admin: reset bloqueado en fin de semana y fuera de horario laboral
        - effect: deny
          reason: "reset_vault bloqueado fuera del horario laboral (Lun-Vie 8:00-18:00)"
          match:
            any:
              - { time: weekday, in: [0, 6] }
              - { time: hour, lt: 8 }
              - { time: hour, gte: 18 }
