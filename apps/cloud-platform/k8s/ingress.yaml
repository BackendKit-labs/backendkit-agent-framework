apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: agent-cloud-backend-ingress
  namespace: agent-cloud
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  tls:
    - hosts:
        - api.agent-cloud.com
      secretName: agent-cloud-tls
  rules:
    - host: api.agent-cloud.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: agent-cloud-backend-service
                port:
                  number: 80