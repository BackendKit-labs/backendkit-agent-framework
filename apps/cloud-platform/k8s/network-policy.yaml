apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agent-cloud-backend
  namespace: agent-cloud
spec:
  podSelector:
    matchLabels:
      app: agent-cloud-backend
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: ingress-nginx
      ports:
        - protocol: TCP
          port: 3000
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              name: agent-cloud
      ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 6379