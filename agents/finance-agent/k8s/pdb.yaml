# ============================================================
# Finance Agent — PodDisruptionBudget
# ============================================================
# Ensures at least 1 replica remains available during
# voluntary disruptions (node drains, cluster upgrades).
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: finance-agent-pdb
  namespace: finance
  labels:
    app: finance-agent
    tier: backend
    team: finance
    environment: production
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: finance-agent
