apiVersion: v1
kind: ConfigMap
metadata:
  name: agent-cloud-config
  namespace: agent-cloud
data:
  NODE_ENV: "production"
  PORT: "3000"
  JWT_EXPIRATION: "1h"
  DATABASE_URL: "postgresql://postgres:postgres@postgres-service:5432/agent_cloud"
  REDIS_URL: "redis://redis-service:6379"
  LOG_LEVEL: "info"
  CORS_ORIGIN: "https://dashboard.agent-cloud.com"